name: Fork Docker Build

# Builds a multi-arch image from this fork's public testing branch and
# publishes it to this fork's GitHub Container Registry, so testers can swap:
#   image: ghcr.io/sirrobot01/decypharr:beta
# for:
#   image: ghcr.io/themightybattlecat/decypharr:latest
#
# The existing config.json is read as-is. Settings this build does not know
# (upstream beta's virtual folders, STRM, NFS/SMB shares and share cache,
# among others) are ignored, and the first save from the Settings page
# writes config.json without them, so keep a copy to switch back.
#
# Most new features are off until enabled in Settings; these usenet
# safeguards are on unless the config turns them off: filling short gaps in
# a stream so playback continues (repair.playback_padding), repairing
# damaged files from their PAR2 files (repair.par2_repair), checking a
# download's articles still exist before import
# (repair.import_availability_check) and sending usenet reads to the faster
# servers first (usenet.prefer_faster_servers).
#
# The database in the /app data folder is read whichever image wrote it:
# upstream beta's current format directly, and the older format of earlier
# images (including earlier builds of this fork) by upgrading it in place on
# first start. Each database file is copied beside itself (a .v3.bak file)
# before it is upgraded; images that predate the upgrade cannot read the
# upgraded files, so restore those copies, or keep a copy of /app, to switch
# back. Upstream beta's per-file IDs are not kept by this build, so .strm
# files written by upstream beta may need writing again after switching back.
#
# NOTE: the Dockerfile embeds the web UI from the COMMITTED
# pkg/server/assets/build/** (no npm stage), so regenerate + commit those
# assets on this branch whenever UI source changes, or the image ships a
# stale UI.

on:
  push:
    branches:
      - usenet-improvements
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Docker image tags must be lowercase, but github.repository_owner
      # preserves the account's actual casing (TheMightyBattleCat) - lowercase
      # it explicitly rather than relying on the raw context value.
      - name: Compute lowercase image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/decypharr" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:usenet-improvements
          build-args: |
            VERSION=usenet-improvements-${{ steps.sha.outputs.short }}
            CHANNEL=fork
          cache-from: type=gha
          cache-to: type=gha,mode=max
