name: Forking-Hell Docker Build

# Builds a multi-arch image from the forking-hell integration branch and
# publishes it to this fork's GitHub Container Registry, so testers can swap:
#   image: ghcr.io/sirrobot01/decypharr:beta
# for:
#   image: ghcr.io/themightybattlecat/decypharr:forking-hell
# Same volumes, same config - all new features default OFF.
#
# NOTE: the Dockerfile embeds the web UI from the COMMITTED
# pkg/server/assets/build/** (no npm stage), so regenerate + commit those
# assets on this branch whenever UI source changes, or the image ships a
# stale UI.

on:
  push:
    branches:
      - forking-hell
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Docker image tags must be lowercase, but github.repository_owner
      # preserves the account's actual casing (TheMightyBattleCat) - lowercase
      # it explicitly rather than relying on the raw context value.
      - name: Compute lowercase image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/decypharr" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:forking-hell
            ${{ steps.image.outputs.name }}:forking-hell-${{ steps.sha.outputs.short }}
          build-args: |
            VERSION=forking-hell-${{ steps.sha.outputs.short }}
            CHANNEL=fork
          cache-from: type=gha
          cache-to: type=gha,mode=max
